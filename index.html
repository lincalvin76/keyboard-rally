<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <title>Keyboard Rally</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="images/ball.png">
    <link rel="stylesheet" href="css/text.css">
    <link rel="stylesheet" href="css/image.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app d-flex flex-column">

    <header class="text-center pt-3 px-2">
        <h1 class="title libertinus-keyboard-regular m-0">
            KEYBOARD <span class="accent">RALLY</span>
        </h1>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center px-2">
        <div class="tennis" id="tennis">
            <img src="images/cat.png" class="cat" id="cat" draggable="false" alt="">
            <img src="images/racquet.png" class="racquet" id="racquet" draggable="false" alt="">
            <div class="ball-wrap" id="ball-wrap">
                <img src="images/ball.png" class="ball" id="ball" draggable="false" alt="">
            </div>
        </div>
    </main>

    <footer class="typing-panel bg-dark text-dark-emphasis rounded border border-warning mx-auto mb-3 p-3">
        <div id="wordDisplay" class="text-center mb-3"></div>

        <div id="statsDisplay" class="stats d-flex flex-wrap justify-content-center gap-2 gap-sm-5 user-select-none">
            <div>WPM: <span id="wpm">0</span></div>
            <div>Accuracy: <span id="acc">0</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>

        <div class="gh-wrap text-center mt-3">
            <a href="https://github.com/lincalvin76" target="_blank" rel="noopener">
                <img src="images/github.png" class="gh-icon" alt="GitHub">
            </a>
        </div>
    </footer>

    <!-- Lets phones open their on-screen keyboard -->
    <input id="mobileInput" class="visually-hidden" type="text"
           autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" aria-label="Type here">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="js/stats.js"></script>
    <script src="js/tennis-cat.js"></script>
    <script src="js/words.js"></script>
    <script src="js/audio.js"></script>
</body>
</html>
